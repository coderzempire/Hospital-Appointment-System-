<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global Hospitals - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Page -->
    <div class="login-page">

        <!-- Navigation Bar -->
        <header class="navbar">

            <div class="logo">
                <span class="logo-icon">
                    ♟
                </span>
                <span>GLOBAL HOSPITALS</span>
            </div>

            <nav>
                <a href="#">HOME</a>
                <a href="#">ABOUT US</a>
                <a href="#">CONTACT</a>
            </nav>

        </header>


        <!-- Main Content -->
        <main class="main-content">

            <!-- Left Welcome Section -->
            <section class="welcome-section">

                <div class="rocket">
                    🚀
                </div>

                <h1>Welcome</h1>

            </section>


            <!-- Login Card -->
            <section class="login-card">

                <!-- User Type -->
                <div class="user-switch">

                    <button class="user-type" onclick="changeRole('Patient')">
                        Patient
                    </button>

                    <button class="user-type active" onclick="changeRole('Doctor')">
                        Doctor
                    </button>

                    <button class="user-type" onclick="changeRole('Admin')">
                        Admin
                    </button>

                </div>


                <!-- Login Heading -->
                <h2 id="loginTitle">
                    Login as Doctor
                </h2>


                <!-- Login Form -->
                <form id="loginForm">

                    <div class="input-row">

                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            value="Ganesh"
                            required
                        >

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            value="123456789"
                            required
                        >

                    </div>


                    <div class="button-container">

                        <button type="submit" class="login-button">
                            Login
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
